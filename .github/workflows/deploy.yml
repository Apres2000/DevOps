name: Deploy Flask App to Timeweb

# Запускаем деплой только при пуше в ветку main
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Шаг 1: Подключаемся к серверу по SSH и выполняем команды обновления кода
      - name: Executing remote ssh commands to deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            cd ~/my_project
            git pull origin main
            docker compose down
            docker compose up -d --build
